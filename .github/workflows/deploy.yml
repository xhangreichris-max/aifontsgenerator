name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # commit generated HTML back to main
  pages: write      # deploy to GitHub Pages
  id-token: write   # OIDC token for Pages

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: build.py dates sitemap <lastmod> from git

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install terser
        run: npm install -g terser@5

      - name: Install Pillow
        run: pip install Pillow

      # ── Build HTML from template + pages-config.json ─────────────────────
      - name: Build HTML pages
        run: python build.py

      # ── Commit generated HTML back to main (replaces build-pages.yml) ────
      - name: Commit generated HTML
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # gallery_generator.py only rewrites a PNG when its inputs change (see
          # content/gallery-manifest.json), so unchanged images never show up here.
          git add *.html chicano-font-generator/ guides/ content/guides/published.json content/gallery-manifest.json
          git diff --staged --quiet || git commit -m "Build: auto-generate sub-pages [skip ci]"
          git push

      # ── Stage all site files into dist/ ───────────────────────────────────
      - name: Stage site files
        run: |
          mkdir -p dist
          # HTML (freshly built above)
          cp *.html dist/ 2>/dev/null || true
          # Build templates are source files, not pages — keep them off the live site
          rm -f dist/template.html dist/template-letter.html dist/template-style.html dist/template-guide.html
          # Stylesheets
          cp *.css  dist/ 2>/dev/null || true
          # JavaScript (source — will be minified in next step)
          cp *.js   dist/ 2>/dev/null || true
          # Static assets
          cp *.xml  dist/ 2>/dev/null || true
          cp *.txt  dist/ 2>/dev/null || true
          cp CNAME  dist/ 2>/dev/null || true
          cp -r images dist/ 2>/dev/null || true
          # Reusable component assets (CSS/JS) + style-page subfolders
          cp -r assets dist/ 2>/dev/null || true
          cp -r chicano-font-generator dist/ 2>/dev/null || true
          # Guides hub + articles (built into guides/ by build.py)
          cp -r guides dist/ 2>/dev/null || true
          # Static JSON API
          cp -r api dist/ 2>/dev/null || true
          echo "=== dist/ contents ==="
          ls -la dist/

      # ── Minify JS in dist/ only — source files in repo stay readable ──────
      - name: Minify JS
        run: |
          echo "=== Minifying JS files in dist/ ==="
          for f in dist/*.js; do
            before=$(wc -c < "$f")
            terser "$f" \
              --compress \
              --mangle \
              --ecma 2020 \
              -o "$f"
            after=$(wc -c < "$f")
            pct=$(awk "BEGIN {printf \"%.1f\", (1 - $after / $before) * 100}")
            echo "  $(basename $f): ${before}B → ${after}B (${pct}% smaller)"
          done
          echo "=== Minification complete ==="

      # ── Upload artifact for Pages deployment ──────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # ── Deploy to GitHub Pages ────────────────────────────────────────────
      # Pages deploys occasionally fail on GitHub's side ("No artifacts named
      # github-pages were found", HTTP 500 creating the deployment). The first
      # attempt may fail without failing the job; if it does, wait 60s and try
      # exactly once more. If the retry also fails, the job fails as normal.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
